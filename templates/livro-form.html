{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Novo Livro</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=login-redesign-2">
</head>

<body>

  <div class="layout">

    <aside class="sidebar">
      <h2>Sistema Biblioteca</h2>
      <span class="version">Versao 1.0</span>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="emprestimos.html">Emprestimos</a>
        <a class="active" href="livros.html">Livros</a>
        <a href="usuarios.html">Usuarios</a>
      </nav>
    </aside>

    <main class="main">

      <h1>Novo Livro</h1>

      <div class="panel">
        <form>
          <label>Titulo</label>
          <input type="text" id="titulo" required>

          <label>Autor</label>
          <input type="text" id="autor" required>

          <label>Categoria</label>
          <input type="text" id="categoria" required>

          <label>ISBN</label>
          <input type="text" id="isbn" required>

          <label>Quantidade Total</label>
          <input type="number" id="total" min="1" required>

          <br><br>
          <button class="btn">Salvar</button>
          <button type="button" class="btn-cancelar" onclick="window.location.href='livros.html'">
            Cancelar</button>
        </form>
      </div>

    </main>

  </div>

  <script src="{% static 'js/shared/config.js' %}?v=login-redesign-2"></script>
  <script src="{% static 'js/shared/api.js' %}?v=login-redesign-2"></script>
  <script src="{% static 'js/pages/livro-form.js' %}?v=login-redesign-2"></script>

</body>

</html>
